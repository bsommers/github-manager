[project]
name = "gmac"
version = "0.1.0"
description = "Git Manager Admin Console: one registry for many GitHub users/orgs, with CLI, TUI and MCP surfaces."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.14",
  "platformdirs>=4.14",
  "tomli-w>=1.2",
  "keyring>=25.7",
  "typer>=0.28",
  "rich>=15",
  "textual>=8.2",
  "fastmcp>=4.1",
]

[project.scripts]
gmac = "gmac.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmac"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "smoke", "unit", "integration", "system", "perf", "stress", "torture",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
