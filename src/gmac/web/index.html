<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>GMAC</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>GMAC</h1>
  <nav role="tablist" aria-label="Views">
    <button role="tab" id="tab-repos" aria-selected="true" aria-controls="panel">Repos</button>
    <button role="tab" id="tab-pulls" aria-selected="false" aria-controls="panel">Pull requests</button>
  </nav>
  <div class="controls">
    <input id="filter" type="search" placeholder="Filter" aria-label="Filter rows" autocomplete="off">
    <select id="source" aria-label="Source"><option value="">All sources</option></select>
    <label class="chk" id="archived-label"><input id="archived" type="checkbox"> Archived</label>
    <button id="refresh" type="button">Refresh</button>
  </div>
</header>
<main>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="panel" role="tabpanel" class="scroll"></div>
</main>
<dialog id="dlg" aria-labelledby="dlg-title">
  <div class="dlg-bar">
    <button id="dlg-back" type="button" hidden>Back</button>
    <h2 id="dlg-title"></h2>
    <button id="dlg-close" type="button" aria-label="Close">Close</button>
  </div>
  <div id="dlg-body"></div>
</dialog>
<script src="/static/app.js"></script>
</body>
</html>
